<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manish SMM Panel — Admin</title><style>
body{margin:0;background:#070a10;color:#f7f9fc;font:15px system-ui;padding:18px}main{max-width:1000px;margin:auto}h1{color:#ff1737}.box,.order{background:#0b1019;border:1px solid #303b4b;border-radius:14px;padding:16px;margin:12px 0}input{background:#080d15;color:white;border:1px solid #354052;padding:12px;border-radius:8px;width:100%;box-sizing:border-box;margin:8px 0}button{border:0;padding:10px 15px;border-radius:8px;color:white;background:#ff1737;font-weight:700;margin:5px;cursor:pointer}.approve{background:#138653}.reject{background:#a82035}.muted{color:#a9b4c5}.order img{max-width:260px;max-height:300px;display:block;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}.status{font-weight:800}
</style></head><body><main><h1>Manish SMM Panel — Admin</h1><p class="muted">Sign in to review payment proof. Verify payment in your own UPI/bank app before approving.</p>
<div class="box" id="loginBox"><label>Admin password</label><input id="password" type="password" placeholder="Admin password"><button onclick="login()">Login</button><p id="loginMsg" class="muted"></p></div>
<div id="dashboard" hidden><div class="row"><button onclick="loadOrders('pending')">Pending</button><button onclick="loadOrders('approved')">Approved</button><button onclick="loadOrders('rejected')">Rejected</button><button onclick="logout()">Logout</button></div><div id="orders"></div></div></main>
<script>
let token='';
async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});let d=await r.json();if(!r.ok){document.getElementById('loginMsg').textContent=d.error||'Login failed';return}token=d.token;document.getElementById('loginBox').hidden=true;document.getElementById('dashboard').hidden=false;loadOrders('pending')}
function logout(){token='';document.getElementById('loginBox').hidden=false;document.getElementById('dashboard').hidden=true}
async function loadOrders(status){let r=await fetch('/api/admin/orders?status='+status,{headers:{Authorization:'Bearer '+token}});if(!r.ok){logout();return}let d=await r.json();let root=document.getElementById('orders');root.innerHTML='';if(!d.orders.length){root.innerHTML='<p class="muted">No '+status+' requests.</p>';return}for(let o of d.orders){let el=document.createElement('section');el.className='order';el.innerHTML=`<h3>Order #${o.id}</h3><p><b>Package:</b> ${esc(o.packageName)} — ₹${esc(o.amount)}</p><p><b>YouTube:</b> <a target="_blank" rel="noopener" href="${safeUrl(o.youtubeChannel)}" style="color:#ff7589">${esc(o.youtubeChannel)}</a></p><p><b>Submitted:</b> ${esc(o.createdAt)}</p><p class="status">Status: ${esc(o.status)}</p><img src="${o.screenshotUrl}" alt="Payment proof"><div class="row">${o.status==='pending'?`<button class="approve" onclick="changeStatus('${o.id}','approved','${status}')">Approve</button><button class="reject" onclick="changeStatus('${o.id}','rejected','${status}')">Reject</button>`:''}</div>`;root.appendChild(el)}}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeUrl(x){try{let u=new URL(x);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}
async function changeStatus(id,status,view){let r=await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({status})});let d=await r.json();if(!r.ok){alert(d.error||'Update failed');return}loadOrders(view)}
</script></body></html>
